<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">xena<span>/</span>garage</a>
      <nav>
        <a href="{{ '/' | relative_url }}">writing</a>
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="{{ '/feed.xml' | relative_url }}">rss</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>built in the garage <span class="dot">·</span> {{ site.time | date: "%Y" }}</span>
      <span><a href="https://github.com/{{ site.github_username }}">github</a> <span class="dot">·</span> <a href="{{ '/feed.xml' | relative_url }}">rss</a></span>
    </footer>
  </div>
</body>
</html>
